<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Spice Cream — тест экрана перехода</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #09070d;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #game canvas {
      display: block;
      margin: auto;
    }

    #message {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 32px;
      color: #fff;
      font: 20px/1.5 Arial, sans-serif;
      text-align: center;
      background: #09070d;
    }

    #editor-controls {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(9, 7, 13, 0.78);
      backdrop-filter: blur(8px);
    }

    #editor-controls button {
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      font: 600 13px/1 Arial, sans-serif;
      cursor: pointer;
      background: #d83d88;
    }

    #editor-controls button:hover {
      background: #ed4e9b;
    }

    #editor-controls button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
    }

    #editor-controls button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #editor-status {
      min-width: 74px;
      color: rgba(255, 255, 255, 0.75);
      font: 12px/1 Arial, sans-serif;
      text-align: center;
    }

    @media (max-width: 700px) {
      #editor-controls {
        top: auto;
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        left: 8px;
        justify-content: center;
      }

      #editor-status {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="message" role="alert"></div>
  <div id="editor-controls" aria-label="Управление словами">
    <button id="copy-positions" type="button">Скопировать позиции</button>
    <button id="reset-positions" type="button">Сбросить</button>
    <span id="editor-status" aria-live="polite">Клик → слово</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="logo-builder.js?v=6"></script>
</body>
</html>
