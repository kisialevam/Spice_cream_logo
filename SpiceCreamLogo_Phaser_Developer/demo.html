<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Spice Cream Logo — Phaser demo</title>
  <style>
    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #09070d;
    }

    canvas {
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="spice-cream-logo-scene.js"></script>
  <script>
    new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: 1080,
      height: 2048,
      backgroundColor: '#24152f',
      scene: [window.SpiceCreamLogoScene],
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      }
    });
  </script>
</body>
</html>
